<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2.5D Interactive Parallax Campaign Showcase</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #0f172a; color: #ffffff; }
        .nav-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; background-color: #0f172a; border-bottom: 1px solid #1e293b; }
        .nav-title { font-size: 15px; font-weight: 600; color: #f8fafc; display: flex; align-items: center; gap: 8px; }
        .nav-tabs { display: flex; gap: 10px; }
        .tab-btn { padding: 8px 18px; border-radius: 8px; border: 1px solid #334155; background-color: #1e293b; color: #94a3b8; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.2s ease; }
        .tab-btn:hover { background-color: #334155; color: #ffffff; }
        .tab-btn.active { background-color: #0284c7; color: #ffffff; border-color: #0284c7; box-shadow: 0 2px 8px rgba(2,132,199,0.4); }
        .stage-container { width: 100%; height: 500px; position: relative; background-color: #020617; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
    </style>
</head>
<body>
    <div class="nav-header">
        <div class="nav-title">
            <span>✨</span> 2.5D Parallax Interactive Showcase
        </div>
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchCampaign(1, this)">Campaign 1 (Hero Parallax)</button>
            <button class="tab-btn" onclick="switchCampaign(2, this)">Campaign 2 (Full Extraction)</button>
            <button class="tab-btn" onclick="switchCampaign(3, this)">Campaign 3 (Interactive MVP)</button>
        </div>
    </div>
    <div class="stage-container">
        <iframe id="stage" src="https://alex-cartwright.github.io/parallax-banner/index.html"></iframe>
    </div>

    <script>
        const urls = {
            1: "https://alex-cartwright.github.io/parallax-banner/index.html",
            2: "https://alex-cartwright.github.io/parallax-banner/banner2.html",
            3: "https://alex-cartwright.github.io/parallax-banner/banner3.html"
        };
        function switchCampaign(id, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('stage').src = urls[id];
        }
    </script>
</body>
</html>
